<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Page</title>
</head>
<body>
    <header>
        <a href="index.html" target="_blank">
        <img src="new_cn_logo.svg"
        alt="codingninjaslogo" title="Logo" />
        </a>
        </header>
    <hr />
    <section id="contact-info">
    <h2>Contact Details</h2>
    <p>
        For inquiries you can reach us via email or phone:
    </p>
    Email: <a href="mailto:contact@codingninjas.com">contact@codingninjas.com</a>
    <br />
    <br />
    Phone: <a href="tel:1800-123-3598">1800-123-3598</a>
    </section>
    <hr />
    <section id="map">
    <h2>Location Map</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d56129.720290080084!2d76.98570343125002!3d28.4461751!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d03d1c62ba76b%3A0xec4dbad7537d963b!2sCoding%20Ninjas!5e0!3m2!1sen!2sin!4v1772996327856!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
    <hr />
    <section id="form">
    <form id="feedback-form" action="#" method="post">
        <fieldset>
            <legend><b>Feedback Form</b></legend>
            <label for="#name">Name:</label>
            <input id="name" name="name" type="text" required>
            <br />
            <br />
            <label for="email">Email:</label>
            <input id="email" name="email" type="email" required>
            <br />
            <br />
            <label for="subject">Subject:</label>
            <input id="subject" name="subject" type="text" required>
            <br />
            <br />
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="7" cols="25" required></textarea>
            <br />
            <br />
            <input type="submit" name="submit" value="Submit">
        </fieldset>
    </form>
    </section>
</body>
</html>
